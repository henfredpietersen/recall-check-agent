[project]
name = "recall-check-agent"
version = "0.1.0"
description = "Check products and vehicles against live US recall data (CPSC, NHTSA) with a small rule-based tool-calling agent."
requires-python = ">=3.10"

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
